<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dead end — Robin Lab</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<style>
  :root{--paper:#e9e5db;--ink:#14120e;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--serif:"Iowan Old Style",Palatino,Georgia,serif}
  html,body{height:100%;margin:0}
  body{background:var(--paper);color:var(--ink);display:grid;place-content:center;text-align:center;font-family:var(--mono);padding:32px}
  .kicker{font-size:11px;letter-spacing:.22em;text-transform:uppercase;opacity:.55;margin:0 0 1.2em}
  h1{font-family:var(--serif);font-weight:400;font-size:clamp(40px,11vw,96px);margin:0;line-height:.95;color:transparent;-webkit-text-stroke:1.6px var(--ink)}
  p{margin:1.6em 0 0;font-size:12px;letter-spacing:.1em}
  a{color:inherit;border-bottom:1px solid rgba(20,18,14,.35);text-decoration:none}
  a:hover{border-color:var(--ink)}
</style>
</head>
<body>
  <p class="kicker">404 — wrong corridor</p>
  <h1>Dead end</h1>
  <p><a href="/">← walk back to the entrance</a></p>
</body>
</html>
